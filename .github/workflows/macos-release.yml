name: macOS Release Build

on:
  workflow_call:
    inputs:
      source_ref:
        description: Git ref to check out
        required: false
        default: ""
        type: string
  workflow_dispatch:
  push:
    branches:
      - main
      - Qt-Rewrite
    paths:
      - ".github/workflows/macos-release.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "licenses/**"
      - "resources/**"
      - "scripts/test_verify_next_package.py"
      - "scripts/verify_next_package.py"
      - "scripts/build_release_macos.sh"
      - "scripts/phase4/audit_resource_stage.py"
      - "src/**"
      - "third_party/sqlite/**"
  pull_request:
    paths:
      - ".github/workflows/macos-release.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "licenses/**"
      - "resources/**"
      - "scripts/test_verify_next_package.py"
      - "scripts/verify_next_package.py"
      - "scripts/build_release_macos.sh"
      - "scripts/phase4/audit_resource_stage.py"
      - "src/**"
      - "third_party/sqlite/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.12.0"

jobs:
  build:
    name: macOS universal (x86_64 and ARM64)
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      QT_ROOT: ${{ github.workspace }}/Qt
      QT_MACOS_PREFIX: ${{ github.workspace }}/Qt/6.12.0/macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Qt
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          aqt_args=(
            install-qt mac desktop "${QT_VERSION}" clang_64
            --outputdir "${QT_ROOT}"
            --timeout 30
            --modules qtpdf
          )
          for attempt in 1 2 3; do
            if python -m aqt "${aqt_args[@]}"; then
              break
            fi
            if [[ "${attempt}" -eq 3 ]]; then
              echo "Qt installation failed after ${attempt} attempts." >&2
              exit 1
            fi
            echo "Qt installation failed on attempt ${attempt}; retrying in 10 seconds." >&2
            sleep 10
          done

      - name: Build and verify disk image
        shell: bash
        env:
          CLASSMNGR_RELEASE_BUILD_DIR: ${{ github.workspace }}/build/macos-next-release-package
          CLASSMNGR_RELEASE_OUTPUT_DIR: ${{ github.workspace }}/build/macos-next-release-package/release-output
        run: bash scripts/build_release_macos.sh

      - name: Run focused package verifier tests
        shell: bash
        run: python scripts/test_verify_next_package.py

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ClassMngr-macos-universal
          path: |
            build/macos-next-release-package/release-output/ClassMngr-*-macos-universal.dmg
            build/macos-next-release-package/release-output/checksums-macos.txt
            build/macos-next-release-package/reports/macos-next-package.json
          if-no-files-found: error
