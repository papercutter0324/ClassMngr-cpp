name: macOS Release Build

on:
  workflow_call:
    inputs:
      source_ref:
        description: Git ref to check out
        required: false
        default: ""
        type: string
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/macos-release.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "licenses/**"
      - "resources/**"
      - "scripts/check_resource_pack_references.py"
      - "scripts/build_release_macos.sh"
      - "scripts/deploy_release_macos.sh"
      - "scripts/write_build_report.py"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/macos-release.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "licenses/**"
      - "resources/**"
      - "scripts/check_resource_pack_references.py"
      - "scripts/build_release_macos.sh"
      - "scripts/deploy_release_macos.sh"
      - "scripts/write_build_report.py"
      - "src/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.12.0"

jobs:
  build:
    name: macOS universal (x86_64 and ARM64)
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      QT_ROOT: ${{ github.workspace }}/Qt
      QT_MACOS_PREFIX: ${{ github.workspace }}/Qt/6.12.0/macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Qt
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          python -m aqt install-qt \
            mac desktop "${QT_VERSION}" clang_64 \
            --outputdir "${QT_ROOT}" \
            --modules qtpdf

      - name: Build and verify disk image
        shell: bash
        run: bash scripts/build_release_macos.sh

      - name: Check packaged resource references and write build report
        shell: bash
        run: |
          build_dir="build/macos-clang-release"
          package_root="build/macos-clang-release/installer-stage/ClassMngr.app"
          python scripts/check_resource_pack_references.py \
            --repository . \
            --build-dir "${build_dir}" \
            --pack-directory "${package_root}/Contents/Resources/resource-packs" \
            --output artifacts/build-reports/macos-universal-resource-pack-references.json
          python scripts/write_build_report.py \
            --package-root "${package_root}" \
            --build-dir "${build_dir}" \
            --output artifacts/build-reports/macos-universal.json

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ClassMngr-macos-universal
          path: |
            dist/ClassMngr-*-macos-universal.dmg
            dist/checksums-macos.txt
            artifacts/build-reports/macos-universal.json
            artifacts/build-reports/macos-universal-resource-pack-references.json
          if-no-files-found: error
