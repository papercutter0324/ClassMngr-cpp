name: Linux x64 Release Build

on:
  workflow_call:
    inputs:
      source_ref:
        description: Git ref to check out
        required: false
        default: ""
        type: string
      run_phase0_baseline:
        description: Run supplemental Linux x64 packaged Release Phase 0 evidence
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      run_phase0_baseline:
        description: Run supplemental Linux x64 packaged Release Phase 0 evidence
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - Qt-Rewrite
    paths:
      - ".github/workflows/linux-release.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "licenses/**"
      - "resources/**"
      - "scripts/test_verify_next_package.py"
      - "scripts/verify_next_package.py"
      - "scripts/phase4/audit_resource_stage.py"
      - "scripts/phase0/**"
      - "src/**"
      - "third_party/sqlite/**"
  pull_request:
    paths:
      - ".github/workflows/linux-release.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "licenses/**"
      - "resources/**"
      - "scripts/test_verify_next_package.py"
      - "scripts/verify_next_package.py"
      - "scripts/phase4/audit_resource_stage.py"
      - "scripts/phase0/**"
      - "src/**"
      - "third_party/sqlite/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.12.0"

jobs:
  build:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.run_phase0_baseline && 180 || 60 }}
    env:
      QT_ROOT: ${{ github.workspace }}/Qt
      QT_LINUX_PREFIX: ${{ github.workspace }}/Qt/6.12.0/gcc_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libcups2-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-cursor-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev \
            ninja-build \
            patchelf \
            zlib1g-dev

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: List Qt modules
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          echo "Available modules for ${QT_VERSION}:"
          # Show available modules for diagnostics; don't fail the job here
          python -m aqt list-qt linux desktop --modules "${QT_VERSION}" linux_gcc_64 || true

      - name: Install Qt
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0

          # Query available modules and store into a variable
          available=$(python -m aqt list-qt linux desktop --modules "${QT_VERSION}" linux_gcc_64 2>/dev/null || true)
          echo "Available modules output:\n$available"

          # Decide modules to install: prefer qtdeclarative qtpdf qttools, but only request what exists
          modules=""
          echo "$available" | grep -q "qtdeclarative" && modules="${modules} qtdeclarative"
          echo "$available" | grep -q "qtpdf" && modules="${modules} qtpdf"
          echo "$available" | grep -q "qttools" && modules="${modules} qttools"
          modules="$(echo $modules)"

          if [ -z "$modules" ]; then
            echo "No requested modules found; installing default Qt package set for ${QT_VERSION}."
            python -m aqt install-qt linux desktop "${QT_VERSION}" linux_gcc_64 \
              --outputdir "${QT_ROOT}"
          else
            echo "Installing Qt modules: $modules"
            python -m aqt install-qt linux desktop "${QT_VERSION}" linux_gcc_64 \
              --outputdir "${QT_ROOT}" \
              --modules $modules
          fi

      - name: Configure
        shell: bash
        run: |
          cmake --fresh --preset linux-gcc-release \
            "-DCMAKE_PREFIX_PATH=${QT_LINUX_PREFIX}" \
            "-DCMAKE_INSTALL_PREFIX=${GITHUB_WORKSPACE}/dist/ClassMngr-linux-x86_64" \
            -DCLASSMNGR_NEXT_RELEASE_PACKAGE=ON \
            -DBUILD_TESTING=OFF

      - name: Build and install
        shell: bash
        run: |
          cmake --build --preset linux-gcc-release \
            --target ClassMngrNextResourcePackage \
            --parallel
          cmake --install build/linux-gcc-release

      - name: Verify architecture and package
        shell: bash
        run: |
          executable="dist/ClassMngr-linux-x86_64/bin/ClassMngr"
          project_version="$(
            awk '
              /project[[:space:]]*[(][[:space:]]*ClassMngr/ {
                in_project = 1
              }
              in_project && /VERSION[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+/ {
                for (field = 1; field <= NF; ++field) {
                  if ($field == "VERSION") {
                    print $(field + 1)
                    exit
                  }
                }
              }
            ' CMakeLists.txt
          )"

          if [[ -z "${project_version}" ]]; then
            echo "Unable to read ClassMngr project version." >&2
            exit 1
          fi

          python scripts/test_verify_next_package.py
          python scripts/verify_next_package.py create \
            --package-root "dist/ClassMngr-linux-x86_64" \
            --platform linux \
            --architecture x86_64 \
            --version "${project_version}" \
            --qt-version "${QT_VERSION}"
          python scripts/verify_next_package.py verify \
            --package-root "dist/ClassMngr-linux-x86_64" \
            --platform linux \
            --architecture x86_64 \
            --version "${project_version}" \
            --qt-version "${QT_VERSION}" \
            --report artifacts/build-reports/linux-x86_64-next-package.json

          test -x "${executable}"
          file "${executable}"
          file "${executable}" | grep -q "ELF 64-bit.*x86-64"

          tar -C dist \
            -czf dist/ClassMngr-linux-x86_64.tar.gz \
            ClassMngr-linux-x86_64

          (
            cd dist
            sha256sum ClassMngr-linux-x86_64.tar.gz > checksums-linux.txt
            sha256sum --check checksums-linux.txt
          )

          package_extract_root="$(mktemp -d "${RUNNER_TEMP}/classmngr-linux-package.XXXXXX")"
          trap 'rm -rf "${package_extract_root}"' EXIT
          tar -xzf dist/ClassMngr-linux-x86_64.tar.gz -C "${package_extract_root}"
          mkdir -p artifacts/build-reports
          python scripts/verify_next_package.py verify \
            --package-root "${package_extract_root}/ClassMngr-linux-x86_64" \
            --platform linux \
            --architecture x86_64 \
            --version "${project_version}" \
            --qt-version "${QT_VERSION}" \
            --report artifacts/build-reports/linux-x86_64-final-package.json

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ClassMngr-linux-x86_64
          path: |
            dist/ClassMngr-linux-x86_64.tar.gz
            dist/checksums-linux.txt
            artifacts/build-reports/linux-x86_64-next-package.json
            artifacts/build-reports/linux-x86_64-final-package.json
          if-no-files-found: error

      - name: Install Xvfb for supplemental Phase 0
        if: ${{ inputs.run_phase0_baseline }}
        shell: bash
        run: |
          sudo apt-get install --yes --no-install-recommends xauth xvfb

      - name: Stage Legacy application for supplemental Phase 0
        if: ${{ inputs.run_phase0_baseline }}
        shell: bash
        run: |
          legacy_root="${GITHUB_WORKSPACE}/dist/ClassMngr-linux-x86_64-phase0"
          cmake --fresh --preset linux-gcc-release \
            -B build/linux-gcc-phase0-legacy \
            "-DCMAKE_PREFIX_PATH=${QT_LINUX_PREFIX}" \
            "-DCMAKE_INSTALL_PREFIX=${legacy_root}" \
            -DCLASSMNGR_NEXT_RELEASE_PACKAGE=OFF \
            -DBUILD_TESTING=OFF
          cmake --build build/linux-gcc-phase0-legacy \
            --target ClassMngr \
            --parallel
          cmake --install build/linux-gcc-phase0-legacy \
            --prefix "${legacy_root}"

      - name: Run supplemental Linux x64 Phase 0 baseline
        if: ${{ inputs.run_phase0_baseline }}
        shell: bash
        env:
          PHASE0_EVIDENCE_ROOT: ${{ runner.temp }}/ClassMngr-phase0-linux-x64-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python scripts/phase0/run_phase0_evidence_linux.py \
            --evidence-root "${PHASE0_EVIDENCE_ROOT}" \
            --package-root "dist/ClassMngr-linux-x86_64-phase0" \
            --qt-prefix "${QT_LINUX_PREFIX}" \
            --timeout-seconds 900 \
            --parallel 4

      - name: Upload supplemental Linux Phase 0 evidence
        if: ${{ always() && inputs.run_phase0_baseline }}
        uses: actions/upload-artifact@v7
        with:
          name: ClassMngr-linux-x86_64-phase0-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ClassMngr-phase0-linux-x64-${{ github.run_id }}-${{ github.run_attempt }}/
            !${{ runner.temp }}/ClassMngr-phase0-linux-x64-${{ github.run_id }}-${{ github.run_attempt }}/tmp/**
            !${{ runner.temp }}/ClassMngr-phase0-linux-x64-${{ github.run_id }}-${{ github.run_attempt }}/tools/**
          if-no-files-found: error
          retention-days: 90
