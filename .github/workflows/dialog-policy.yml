name: Dialog policy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dialog-policy.yml"
      - "scripts/check_dialog_policy.py"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/dialog-policy.yml"
      - "scripts/check_dialog_policy.py"
      - "src/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce:
    name: Direct Qt dialog usage
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Enforce shared dialog boundaries
        run: python scripts/check_dialog_policy.py
