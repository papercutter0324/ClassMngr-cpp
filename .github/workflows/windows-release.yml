name: Windows Release Builds

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-release.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "licenses/**"
      - "resources/**"
      - "scripts/installer/**"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/windows-release.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "licenses/**"
      - "resources/**"
      - "scripts/installer/**"
      - "src/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.11.1"
  QT_ROOT: "C:\\Qt"
  QT_MSVC_X64_PREFIX: "C:\\Qt\\6.11.1\\msvc2022_64"
  QT_MSVC_ARM64_PREFIX: "C:\\Qt\\6.11.1\\msvc2022_arm64"

jobs:
  build:
    name: Windows ${{ matrix.display_name }}
    runs-on: windows-2022
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - display_name: x64
            preset: windows-x64-release
            qt_prefix: "C:\\Qt\\6.11.1\\msvc2022_64"
            artifact_arch: x64
            machine_pattern: 'machine \(x64\)'
          - display_name: ARM64
            preset: windows-arm64-release
            qt_prefix: "C:\\Qt\\6.11.1\\msvc2022_arm64"
            artifact_arch: arm64
            machine_pattern: 'machine \(ARM64\)'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install aqtinstall
        shell: pwsh
        run: python -m pip install --disable-pip-version-check aqtinstall==3.3.0

      - name: Install Qt x64 host tools
        shell: pwsh
        run: >-
          python -m aqt install-qt
          windows desktop $env:QT_VERSION win64_msvc2022_64
          --outputdir $env:QT_ROOT
          --modules qtdeclarative qtpdf qttools

      - name: Install Qt ARM64 target
        if: matrix.artifact_arch == 'arm64'
        shell: pwsh
        run: >-
          python -m aqt install-qt
          windows desktop $env:QT_VERSION win64_msvc2022_arm64_cross_compiled
          --outputdir $env:QT_ROOT
          --modules qtdeclarative qtpdf qttools

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Configure
        shell: pwsh
        run: >-
          cmake --fresh --preset "${{ matrix.preset }}"
          "-DCMAKE_PREFIX_PATH=${{ matrix.qt_prefix }}"
          -DBUILD_TESTING=OFF

      - name: Build installer
        shell: pwsh
        run: cmake --build --preset "${{ matrix.preset }}-installer" --parallel

      - name: Verify architecture and create checksum
        shell: pwsh
        run: |
          $executable = "build\${{ matrix.preset }}\Release\ClassMngr.exe"

          if (-not (Test-Path -LiteralPath $executable)) {
              throw "Expected executable was not found: $executable"
          }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem -Path (
              Join-Path $vsPath "VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe"
          ) |
              Sort-Object FullName -Descending |
              Select-Object -First 1

          if ($null -eq $dumpbin) {
              throw "dumpbin.exe was not found in the Visual Studio installation."
          }

          $headers = (& $dumpbin.FullName /headers $executable 2>&1) -join "`n"

          if ($headers -notmatch '${{ matrix.machine_pattern }}') {
              throw "Executable did not have the expected ${{ matrix.display_name }} architecture."
          }

          $installers = @(
              Get-ChildItem -Path "dist\ClassMngr-*-win-${{ matrix.artifact_arch }}.exe"
          )

          if ($installers.Count -ne 1) {
              throw "Expected exactly one installer, found $($installers.Count)."
          }

          $hash = (
              Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          $checksumPath = "dist\checksums-windows-${{ matrix.artifact_arch }}.txt"
          "$hash  $($installers[0].Name)" |
              Set-Content -LiteralPath $checksumPath -Encoding utf8NoBOM

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ClassMngr-windows-${{ matrix.artifact_arch }}
          path: |
            dist/ClassMngr-*-win-${{ matrix.artifact_arch }}.exe
            dist/checksums-windows-${{ matrix.artifact_arch }}.txt
          if-no-files-found: error