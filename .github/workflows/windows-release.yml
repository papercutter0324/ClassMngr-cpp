name: Windows Release Build

on:
  workflow_call:
    inputs:
      architecture:
        description: Architecture to build
        required: false
        default: all
        type: string
      source_ref:
        description: Git ref to check out
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      architecture:
        description: Architecture to build
        required: true
        default: all
        type: choice
        options:
          - all
          - x64
          - arm64
  push:
    branches:
      - main
      - Qt-Rewrite
    paths:
      - ".github/workflows/windows-release.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "licenses/**"
      - "resources/**"
      - "scripts/test_verify_next_package.py"
      - "scripts/verify_next_package.py"
      - "scripts/phase4/audit_resource_stage.py"
      - "scripts/installer/**"
      - "scripts/phase7/**"
      - "src/**"
      - "tests/phase7_next_memory_fixture_tests.cpp"
      - "third_party/sqlite/**"
  pull_request:
    paths:
      - ".github/workflows/windows-release.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "licenses/**"
      - "resources/**"
      - "scripts/test_verify_next_package.py"
      - "scripts/verify_next_package.py"
      - "scripts/phase4/audit_resource_stage.py"
      - "scripts/installer/**"
      - "scripts/phase7/**"
      - "src/**"
      - "tests/phase7_next_memory_fixture_tests.cpp"
      - "third_party/sqlite/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep release builds on the Visual Studio 2022 toolchain even when a
  # future hosted image includes a newer Visual Studio release.
  CMAKE_GENERATOR: "Visual Studio 17 2022"
  QT_VERSION: "6.12.0"
  QT_ROOT: "C:\\Qt"
  QT_MSVC_X64_PREFIX: "C:\\Qt\\6.12.0\\msvc2022_64"
  QT_MSVC_ARM64_PREFIX: "C:\\Qt\\6.12.0\\msvc2022_arm64"

jobs:
  build:
    name: Windows ${{ matrix.architecture == 'x64' && 'x64' || 'ARM64' }}
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        architecture: >-
          ${{ fromJSON(inputs.architecture == 'x64' && '["x64"]' ||
          inputs.architecture == 'arm64' && '["arm64"]' ||
          '["x64", "arm64"]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install aqtinstall with Qt 6.12 Windows support
        shell: pwsh
        run: |
          cd $Env:GITHUB_WORKSPACE
          # aqtinstall 3.3.0 predates Qt 6.12's architecture-specific
          # Windows repository layout. Pin the upstream fix until released.
          python -m pip install --disable-pip-version-check "aqtinstall @ git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"

      - name: Show available Qt versions
        shell: pwsh
        run: |
          cd $Env:GITHUB_WORKSPACE
          python -m aqt list-qt windows desktop

      - name: Install Qt x64 host tools (with retries)
        shell: pwsh
        run: |
          Set-Location $Env:GITHUB_WORKSPACE

          # Qt's ARM64 package is cross-compiled. QT_HOST_PATH must refer to
          # native tools, including qtpaths and lconvert, from the same Qt
          # version. The x64 build uses this installation as its target too.
          $arguments = @(
            "-m", "aqt",
            "install-qt",
            "windows", "desktop",
            $env:QT_VERSION,
            "win64_msvc2022_64",
            "--outputdir", $env:QT_ROOT,
            "--base", "https://download.qt.io",
            "--timeout", "30",
            "--modules", "qtpdf"
          )

          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            & python @arguments
            $exitCode = $LASTEXITCODE

            if ($exitCode -eq 0) {
              break
            }

            if ($attempt -eq $maxAttempts) {
              throw "aqt host-tools installation failed after $maxAttempts attempts (exit code $exitCode)"
            }

            Write-Warning "aqt host-tools installation failed on attempt $attempt (exit code $exitCode); retrying..."
            Start-Sleep -Seconds (10 * $attempt)
          }

          $qtpaths = @(
            @(
              (Join-Path $env:QT_MSVC_X64_PREFIX "bin\\qtpaths6.exe"),
              (Join-Path $env:QT_MSVC_X64_PREFIX "bin\\qtpaths.exe")
            ) | Where-Object { Test-Path -LiteralPath $_ }
          )
          if ($qtpaths.Count -eq 0) {
            throw "Qt host installation is incomplete: qtpaths was not found under $env:QT_MSVC_X64_PREFIX\\bin"
          }

          $lconvert = Join-Path $env:QT_MSVC_X64_PREFIX "bin\\lconvert.exe"
          if (-not (Test-Path -LiteralPath $lconvert)) {
            throw "Qt host installation is incomplete: $lconvert was not found"
          }

          $qtCmake = Join-Path $env:QT_MSVC_X64_PREFIX "bin\qt-cmake.bat"
          if (-not (Test-Path -LiteralPath $qtCmake)) {
            throw "Qt installation is incomplete: $qtCmake was not found"
          }

      - name: Install Qt ARM64 target (with retries)
        if: matrix.architecture == 'arm64'
        shell: pwsh
        run: |
          Set-Location $Env:GITHUB_WORKSPACE

          $arguments = @(
            "-m", "aqt",
            "install-qt",
            "windows", "desktop",
            $env:QT_VERSION,
            "win64_msvc2022_arm64_cross_compiled",
            "--outputdir", $env:QT_ROOT,
            "--base", "https://download.qt.io",
            "--timeout", "30",
            # Qt Declarative and the command-line tools are included in the
            # Qt 6.12 base package; Qt Pdf remains a separate extension.
            "--modules", "qtpdf"
          )

          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            & python @arguments
            $exitCode = $LASTEXITCODE

            if ($exitCode -eq 0) {
              break
            }

            if ($attempt -eq $maxAttempts) {
              throw "aqt target installation failed after $maxAttempts attempts (exit code $exitCode)"
            }

            Write-Warning "aqt target installation failed on attempt $attempt (exit code $exitCode); retrying..."
            Start-Sleep -Seconds (10 * $attempt)
          }

          $qtCmake = Join-Path $env:QT_MSVC_ARM64_PREFIX "bin\\qt-cmake.bat"
          if (-not (Test-Path -LiteralPath $qtCmake)) {
            throw "Qt installation is incomplete: $qtCmake was not found"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Check out pinned innoextract source
        uses: actions/checkout@v6
        with:
          repository: dscharrer/innoextract
          ref: 376a13e7c41cc5528b6088d0dd16ec1b323a8d37
          path: build/ci-tools/innoextract-source
          persist-credentials: false

      - name: Check out pinned vcpkg dependency ports
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: 9eec002df1cd109f8f104cd966a763daf9751489
          path: build/ci-tools/vcpkg
          persist-credentials: false

      - name: Build pinned innoextract for payload inspection
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $innoextractCommit = "376a13e7c41cc5528b6088d0dd16ec1b323a8d37"
          $vcpkgCommit = "9eec002df1cd109f8f104cd966a763daf9751489"
          $toolRoot = Join-Path $env:GITHUB_WORKSPACE "build\ci-tools"
          $innoextractSource = Join-Path $toolRoot "innoextract-source"
          $vcpkgRoot = Join-Path $toolRoot "vcpkg"
          foreach ($source in @(
            @{ Path = $innoextractSource; Commit = $innoextractCommit; Name = "innoextract" },
            @{ Path = $vcpkgRoot; Commit = $vcpkgCommit; Name = "vcpkg" }
          )) {
            $actualCommit = (git -C $source.Path rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $actualCommit -ne $source.Commit) {
              throw "$($source.Name) checkout resolved to '$actualCommit', expected '$($source.Commit)'."
            }
          }

          $innoextractCmake = Join-Path $innoextractSource "CMakeLists.txt"
          $cmakeContent = [System.IO.File]::ReadAllText($innoextractCmake)
          $boostBlockPattern = '(?m)^find_package\(Boost REQUIRED COMPONENTS\r?\n\tiostreams\r?\n\tfilesystem\r?\n\tdate_time\r?\n\tsystem\r?\n\tprogram_options\r?\n\)'
          $boostBlockMatches = [regex]::Matches($cmakeContent, $boostBlockPattern)
          if ($boostBlockMatches.Count -ne 1) {
            throw "Expected exactly one unpatched Boost component block in pinned innoextract CMakeLists.txt; found $($boostBlockMatches.Count)."
          }
          $boostReplacement = @(
            'set(BOOST_REQUIRED_COMPONENTS',
            "`tiostreams",
            "`tfilesystem",
            "`tdate_time",
            "`tprogram_options",
            ')',
            'find_package(Boost REQUIRED COMPONENTS ${BOOST_REQUIRED_COMPONENTS})',
            'if(Boost_MAJOR_VERSION EQUAL 1 AND Boost_MINOR_VERSION LESS 69)',
            "`tlist(APPEND BOOST_REQUIRED_COMPONENTS system)",
            'find_package(Boost REQUIRED COMPONENTS ${BOOST_REQUIRED_COMPONENTS})',
            'endif()'
          ) -join "`n"
          $boostBlock = $boostBlockMatches[0]
          $cmakeContent = $cmakeContent.Substring(0, $boostBlock.Index) +
            $boostReplacement +
            $cmakeContent.Substring($boostBlock.Index + $boostBlock.Length)
          [System.IO.File]::WriteAllText(
            $innoextractCmake,
            $cmakeContent,
            [System.Text.UTF8Encoding]::new($false)
          )

          & (Join-Path $vcpkgRoot "bootstrap-vcpkg.bat") -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "Pinned vcpkg bootstrap failed with exit code $LASTEXITCODE." }
          $vcpkgExe = Join-Path $vcpkgRoot "vcpkg.exe"
          & $vcpkgExe install `
            "boost-date-time:x64-windows-static" `
            "boost-foreach:x64-windows-static" `
            "boost-filesystem:x64-windows-static" `
            "boost-format:x64-windows-static" `
            "boost-iostreams:x64-windows-static" `
            "boost-program-options:x64-windows-static" `
            "boost-system:x64-windows-static" `
            "bzip2:x64-windows-static" `
            "liblzma:x64-windows-static" `
            "zlib:x64-windows-static"
          if ($LASTEXITCODE -ne 0) { throw "Pinned innoextract dependency installation failed with exit code $LASTEXITCODE." }

          $buildRoot = Join-Path $toolRoot "innoextract-build"
          $installRoot = Join-Path $toolRoot "innoextract-install"
          $toolchainFile = Join-Path $vcpkgRoot "scripts\buildsystems\vcpkg.cmake"
          & cmake -S $innoextractSource -B $buildRoot `
            -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchainFile" `
            "-DVCPKG_TARGET_TRIPLET=x64-windows-static" `
            "-DCMAKE_INSTALL_PREFIX=$installRoot" `
            -DSTRICT_USE=ON `
            -DWITH_CONV=win32 `
            -DUSE_LZMA=ON `
            -DUSE_STATIC_LIBS=ON `
            -DBUILD_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { throw "Pinned innoextract CMake configuration failed with exit code $LASTEXITCODE." }
          & cmake --build $buildRoot --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Pinned innoextract build failed with exit code $LASTEXITCODE." }
          & cmake --install $buildRoot --config Release
          if ($LASTEXITCODE -ne 0) { throw "Pinned innoextract install failed with exit code $LASTEXITCODE." }

          $innoextractExe = Join-Path $installRoot "bin\innoextract.exe"
          if (-not (Test-Path -LiteralPath $innoextractExe -PathType Leaf)) {
            throw "Pinned innoextract build did not produce $innoextractExe."
          }
          $versionOutput = (& $innoextractExe --version --silent 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $versionOutput -ne "1.10-dev + $($innoextractCommit.Substring(0, 7))") {
            throw "Pinned innoextract version check failed: '$versionOutput'."
          }
          if (-not $env:GITHUB_ENV) { throw "GITHUB_ENV is unavailable; cannot expose innoextract to the verifier." }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CLASSMNGR_INNOEXTRACT_PATH=$innoextractExe" -Encoding utf8

      - name: Stage signed Visual C++ redistributable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $architecture = "${{ matrix.architecture }}"
          $redistributableName = "vc_redist.$architecture.exe"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vswhereStdout = ""
          $vswhereStderr = ""
          $vswhereExitCode = $null
          $vswhereUnavailableReason = $null
          if (Test-Path -LiteralPath $vswhere -PathType Leaf) {
            $vswhereStartInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $vswhereStartInfo.FileName = $vswhere
            $vswhereStartInfo.UseShellExecute = $false
            $vswhereStartInfo.RedirectStandardOutput = $true
            $vswhereStartInfo.RedirectStandardError = $true
            foreach ($argument in @(
              "-latest",
              "-products", "*",
              "-version", "[17.0,18.0)",
              "-property", "installationPath"
            )) {
              $vswhereStartInfo.ArgumentList.Add($argument)
            }

            $vswhereProcess = [System.Diagnostics.Process]::new()
            $vswhereProcess.StartInfo = $vswhereStartInfo
            try {
              if (-not $vswhereProcess.Start()) {
                throw "The vswhere process did not start."
              }
              $stdoutTask = $vswhereProcess.StandardOutput.ReadToEndAsync()
              $stderrTask = $vswhereProcess.StandardError.ReadToEndAsync()
              $vswhereProcess.WaitForExit()
              $vswhereStdout = $stdoutTask.GetAwaiter().GetResult()
              $vswhereStderr = $stderrTask.GetAwaiter().GetResult()
              $vswhereExitCode = $vswhereProcess.ExitCode
            }
            catch {
              $vswhereUnavailableReason = "Unable to run vswhere at ${vswhere}: $($_.Exception.Message)"
            }
            finally {
              $vswhereProcess.Dispose()
            }
          }
          else {
            $vswhereUnavailableReason = "vswhere.exe was not found at $vswhere."
          }

          $vswhereStdoutJson = ConvertTo-Json -InputObject $vswhereStdout -Compress
          $vswhereStderrJson = ConvertTo-Json -InputObject $vswhereStderr -Compress
          Write-Host "vswhere stdout (JSON-escaped): $vswhereStdoutJson"
          Write-Host "vswhere stderr (JSON-escaped): $vswhereStderrJson"
          if ($null -eq $vswhereExitCode) {
            Write-Host "vswhere exit code: unavailable ($vswhereUnavailableReason)"
          }
          else {
            Write-Host "vswhere exit code: $vswhereExitCode"
          }

          $candidates = @()
          $vsDiscoverySource = "vswhere"
          if ($null -eq $vswhereUnavailableReason -and $vswhereExitCode -eq 0) {
            $queryPaths = @(
              $vswhereStdout -split '\r?\n' |
                ForEach-Object { $_.Trim() } |
                Where-Object { $_ }
            )
            $queryPath = $queryPaths | Select-Object -First 1
            if (-not $queryPath) {
              $vswhereUnavailableReason = "vswhere returned no installation path."
            }
            elseif (-not (Test-Path -LiteralPath $queryPath -PathType Container)) {
              $vswhereUnavailableReason = "vswhere returned a missing installation directory: $queryPath"
            }
            else {
              $queryRedistRoot = Join-Path $queryPath "VC\Redist\MSVC\v143"
              if (-not (Test-Path -LiteralPath $queryRedistRoot -PathType Container)) {
                $vswhereUnavailableReason = "The VS 2022 v143 redistributable tree was not found: $queryRedistRoot"
              }
              else {
                try {
                  $queryCandidates = @(
                    Get-ChildItem -LiteralPath $queryRedistRoot -Recurse -File -Filter $redistributableName -ErrorAction Stop |
                      Where-Object { $_.Name -ceq $redistributableName }
                  )
                }
                catch {
                  $vswhereUnavailableReason = "Unable to inspect the VS 2022 v143 tree ${queryRedistRoot}: $($_.Exception.Message)"
                }
                if (-not $vswhereUnavailableReason) {
                  if ($queryCandidates.Count -eq 0) {
                    $vswhereUnavailableReason = "No $redistributableName was found under the VS 2022 v143 tree $queryRedistRoot."
                  }
                  else {
                    $candidates = $queryCandidates
                  }
                }
              }
            }
          }
          elseif ($null -eq $vswhereUnavailableReason) {
            $vswhereUnavailableReason = "vswhere exited with code $vswhereExitCode."
          }

          if ($vswhereUnavailableReason) {
            $fallbackInstallationPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
            $fallbackRedistRoot = Join-Path $fallbackInstallationPath "VC\Redist\MSVC\v143"
            Write-Host "vswhere discovery was unusable: $vswhereUnavailableReason"
            Write-Host "Trying documented VS 2022 Enterprise fallback: $fallbackInstallationPath"
            if (-not (Test-Path -LiteralPath $fallbackRedistRoot -PathType Container)) {
              throw "Unable to stage ${redistributableName}: vswhere discovery was unusable ($vswhereUnavailableReason); the fallback v143 redistributable tree was not found: $fallbackRedistRoot"
            }
            try {
              $fallbackCandidates = @(
                Get-ChildItem -LiteralPath $fallbackRedistRoot -Recurse -File -Filter $redistributableName -ErrorAction Stop |
                  Where-Object { $_.Name -ceq $redistributableName }
              )
            }
            catch {
              throw "Unable to stage ${redistributableName}: vswhere discovery was unusable ($vswhereUnavailableReason); unable to inspect the fallback v143 tree ${fallbackRedistRoot}: $($_.Exception.Message)"
            }
            if ($fallbackCandidates.Count -eq 0) {
              throw "Unable to stage ${redistributableName}: vswhere discovery was unusable ($vswhereUnavailableReason); the fallback v143 tree contains no ${redistributableName}: $fallbackRedistRoot"
            }
            $candidates = $fallbackCandidates
            $vsDiscoverySource = "documented VS 2022 Enterprise fallback"
          }

          $inspectedCandidates = @(
            foreach ($candidate in $candidates) {
              $versionText = $null
              $fileVersion = $null
              $versionError = $null
              try {
                $versionText = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($candidate.FullName).FileVersion
                if ([string]::IsNullOrWhiteSpace($versionText)) {
                  throw "The file version was empty."
                }
                $fileVersion = [version]::Parse($versionText)
              }
              catch {
                $versionError = $_.Exception.Message
              }

              $loggedVersion = if ($versionText) { $versionText } else { "unavailable" }
              $versionStatus = if ($versionError) { "invalid: $versionError" } else { "valid" }
              Write-Host "Redistributable candidate: package=$redistributableName | path=$($candidate.FullName) | version=$loggedVersion | version status=$versionStatus"

              [pscustomobject]@{
                File = $candidate
                Version = $fileVersion
                VersionText = $versionText
                VersionError = $versionError
              }
            }
          )

          $versionedCandidates = @(
            $inspectedCandidates | Where-Object { $null -ne $_.Version }
          )
          $candidateDiagnostics = ($inspectedCandidates | ForEach-Object {
            $loggedVersion = if ($_.VersionText) { $_.VersionText } else { "unavailable" }
            $versionStatus = if ($_.VersionError) { "invalid: $($_.VersionError)" } else { "valid" }
            "package='$redistributableName'; path='$($_.File.FullName)'; version='$loggedVersion'; version status='$versionStatus'"
          }) -join [Environment]::NewLine
          if ($versionedCandidates.Count -eq 0) {
            throw "No $redistributableName candidate had a valid file version under the VS 2022 v143 tree. Candidates inspected:`n$candidateDiagnostics"
          }

          $selected = $versionedCandidates |
            Sort-Object -Property @{ Expression = "Version"; Descending = $true }, `
              @{ Expression = { $_.File.FullName }; Descending = $false } |
            Select-Object -First 1

          $signature = Get-AuthenticodeSignature -LiteralPath $selected.File.FullName
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "The selected $redistributableName Authenticode signature is '$($signature.Status)': $($selected.File.FullName)"
          }
          if ($signature.SignerCertificate.Subject -notmatch '(^|,\s*)CN=Microsoft Corporation(,|$)') {
            throw "The selected $redistributableName is not signed by Microsoft Corporation: $($signature.SignerCertificate.Subject)"
          }

          $stagingDirectory = Join-Path $Env:GITHUB_WORKSPACE "build\windows-$architecture-release\installer-prerequisites"
          New-Item -ItemType Directory -Path $stagingDirectory -Force | Out-Null
          $stagedPath = Join-Path $stagingDirectory $redistributableName
          Copy-Item -LiteralPath $selected.File.FullName -Destination $stagedPath -Force
          $stagedSignature = Get-AuthenticodeSignature -LiteralPath $stagedPath
          if ($stagedSignature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "The staged $redistributableName failed Authenticode validation: $($stagedSignature.Status)"
          }
          $stagedHash = (Get-FileHash -LiteralPath $stagedPath -Algorithm SHA256).Hash
          Write-Host "Visual Studio discovery route: $vsDiscoverySource"
          Write-Host "Package name: $redistributableName"
          Write-Host "Selected VS 2022 v143 redistributable: $($selected.File.FullName)"
          Write-Host "File version: $($selected.VersionText)"
          Write-Host "Authenticode status: $($signature.Status)"
          Write-Host "Authenticode signer: $($signature.SignerCertificate.Subject)"
          Write-Host "Staged path: $stagedPath"
          Write-Host "SHA-256: $stagedHash"
          "CLASSMNGR_INSTALLER_VC_REDIST_FILE=$stagedPath" | Add-Content -LiteralPath $env:GITHUB_ENV
          @"
          ### Staged Visual C++ redistributable
          - Package: $redistributableName
          - Target architecture: $architecture
          - Discovery route: $vsDiscoverySource
          - File version: $($selected.VersionText)
          - Authenticode status: $($signature.Status)
          - Authenticode signer: $($signature.SignerCertificate.Subject)
          - Source: $($selected.File.FullName)
          - SHA-256: $stagedHash
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Configure
        shell: pwsh
        run: |
          cd $Env:GITHUB_WORKSPACE
          $architecture = "${{ matrix.architecture }}"
          $targetQtPrefix = if ($architecture -eq "arm64") {
            $env:QT_MSVC_ARM64_PREFIX
          } else {
            $env:QT_MSVC_X64_PREFIX
          }
          $testingEnabled = if ($env:GITHUB_REF -eq "refs/heads/Qt-Rewrite" -and $architecture -eq "x64") { "ON" } else { "OFF" }
          $configureArguments = @(
            "--fresh",
            "--preset", "windows-$architecture-release",
            "-DCMAKE_PREFIX_PATH=$targetQtPrefix",
            "-DCLASSMNGR_INSTALLER_VC_REDIST_FILE=$env:CLASSMNGR_INSTALLER_VC_REDIST_FILE",
            "-DCLASSMNGR_NEXT_RELEASE_PACKAGE=ON",
            "-DBUILD_TESTING=$testingEnabled"
          )
          if ($architecture -eq "arm64") {
            $configureArguments += "-DQT_HOST_PATH=$env:QT_MSVC_X64_PREFIX"
          }
          cmake @configureArguments

      - name: Build installer
        shell: pwsh
        run: cmake --build --preset "windows-${{ matrix.architecture }}-release-installer" --parallel

      - name: Build and collect Phase 7 Next memory evidence
        if: github.ref == 'refs/heads/Qt-Rewrite' && matrix.architecture == 'x64'
        continue-on-error: true
        shell: pwsh
        run: |
          Set-Location $Env:GITHUB_WORKSPACE

          cmake --build --preset windows-x64-release --target ClassMngrNextResourcePackage --parallel
          if ($LASTEXITCODE -ne 0) { throw "ClassMngrNextResourcePackage build failed." }

          cmake --build build\windows-x64-release --config Release --target `
            ClassMngrStartupPerformanceTests `
            ClassMngrPhase7NextBlankFixtureTests `
            --parallel
          if ($LASTEXITCODE -ne 0) { throw "Phase 7 fixture test targets failed to build." }

          python -m unittest discover -s scripts/phase7 -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { throw "Phase 7 validator unit tests failed." }

          pwsh -NoProfile -File scripts/phase7/run_next_memory_evidence.ps1 `
            -BuildDirectory build\windows-x64-release `
            -QtPrefix $env:QT_MSVC_X64_PREFIX `
            -EvidenceDirectory artifacts\phase7\windows-x64-next-memory

      - name: Upload Phase 7 Next memory evidence
        if: always() && github.ref == 'refs/heads/Qt-Rewrite' && matrix.architecture == 'x64'
        uses: actions/upload-artifact@v7
        with:
          name: phase7-next-memory-windows-x64
          path: |
            artifacts/phase7/windows-x64-next-memory/manifest.json
            artifacts/phase7/windows-x64-next-memory/metrics.jsonl
            artifacts/phase7/windows-x64-next-memory/summary.json
            artifacts/phase7/windows-x64-next-memory/validator-output.txt
          if-no-files-found: warn

      - name: Build and collect Phase 7 Initial Setup lifecycle evidence
        if: github.ref == 'refs/heads/Qt-Rewrite' && matrix.architecture == 'x64'
        shell: pwsh
        run: |
          Set-Location $Env:GITHUB_WORKSPACE

          cmake --build build\windows-x64-release --config Release --target `
            ClassMngrNextInitialSetupTeacherEntryBootstrapIntegrationTests `
            --parallel
          if ($LASTEXITCODE -ne 0) { throw "Initial Setup lifecycle evidence target failed to build." }

          $evidenceDirectory = Join-Path $Env:GITHUB_WORKSPACE `
            'docs\qt-rewrite\visual-baseline\next\phase-7\initial-setup-lifecycle'
          New-Item -ItemType Directory -Path $evidenceDirectory -Force | Out-Null
          $evidencePath = Join-Path $evidenceDirectory 'initial-setup-lifecycle.json'
          $evidenceExecutable = Join-Path $Env:GITHUB_WORKSPACE `
            'build\windows-x64-release\Release\ClassMngrNextInitialSetupTeacherEntryBootstrapIntegrationTests.exe'
          $qtBin = Join-Path $Env:QT_MSVC_X64_PREFIX 'bin'
          $qtPlatforms = Join-Path $Env:QT_MSVC_X64_PREFIX 'plugins\platforms'
          $oldPath = [Environment]::GetEnvironmentVariable(
            'PATH', [EnvironmentVariableTarget]::Process
          )
          $oldQpaPlatform = [Environment]::GetEnvironmentVariable(
            'QT_QPA_PLATFORM', [EnvironmentVariableTarget]::Process
          )
          $oldQpaPluginPath = [Environment]::GetEnvironmentVariable(
            'QT_QPA_PLATFORM_PLUGIN_PATH', [EnvironmentVariableTarget]::Process
          )
          $env:CLASSMNGR_PHASE7_INITIAL_SETUP_LIFECYCLE_EVIDENCE_OUTPUT = `
            [System.IO.Path]::GetFullPath($evidencePath)
          try {
            [Environment]::SetEnvironmentVariable(
              'PATH', "$qtBin;$oldPath", [EnvironmentVariableTarget]::Process
            )
            [Environment]::SetEnvironmentVariable(
              'QT_QPA_PLATFORM', 'offscreen', [EnvironmentVariableTarget]::Process
            )
            [Environment]::SetEnvironmentVariable(
              'QT_QPA_PLATFORM_PLUGIN_PATH', $qtPlatforms, [EnvironmentVariableTarget]::Process
            )
            & $evidenceExecutable initialSetupLifecycleEvidenceCapture
            $captureExitCode = $LASTEXITCODE
            if ($captureExitCode -ne 0) {
              throw "Initial Setup lifecycle evidence capture failed with exit code $captureExitCode."
            }

            python scripts\phase7\validate_initial_setup_lifecycle_evidence.py `
              --artifact $evidencePath
            if ($LASTEXITCODE -ne 0) { throw "Initial Setup lifecycle evidence validation failed." }
          } finally {
            [Environment]::SetEnvironmentVariable(
              'PATH', $oldPath, [EnvironmentVariableTarget]::Process
            )
            [Environment]::SetEnvironmentVariable(
              'QT_QPA_PLATFORM', $oldQpaPlatform, [EnvironmentVariableTarget]::Process
            )
            [Environment]::SetEnvironmentVariable(
              'QT_QPA_PLATFORM_PLUGIN_PATH', $oldQpaPluginPath, [EnvironmentVariableTarget]::Process
            )
            Remove-Item Env:CLASSMNGR_PHASE7_INITIAL_SETUP_LIFECYCLE_EVIDENCE_OUTPUT `
              -ErrorAction SilentlyContinue
          }

      - name: Upload Phase 7 Initial Setup lifecycle evidence
        if: always() && github.ref == 'refs/heads/Qt-Rewrite' && matrix.architecture == 'x64'
        uses: actions/upload-artifact@v7
        with:
          name: phase7-next-initial-setup-lifecycle-windows-x64
          path: docs/qt-rewrite/visual-baseline/next/phase-7/initial-setup-lifecycle/initial-setup-lifecycle.json
          if-no-files-found: warn

      - name: Diagnostics — environment, build and tooling
        shell: pwsh
        run: |
          cd $Env:GITHUB_WORKSPACE

          Write-Host "=== Basic environment ==="
          Write-Host "User: $env:USERNAME"
          Write-Host "GITHUB_WORKSPACE: $env:GITHUB_WORKSPACE"
          python --version 2>&1 | Write-Host
          pip --version 2>&1 | Write-Host
          python -m pip list --disable-pip-version-check 2>&1 | Select-Object -First 50 | Write-Host

          Write-Host "=== CMake ==="
          Get-Command cmake -ErrorAction SilentlyContinue | Format-List
          cmake --version 2>&1 | Write-Host

          Write-Host "=== Top-level workspace listing ==="
          Get-ChildItem -Path . -Force | Select-Object Name,Mode,Length | Format-Table -AutoSize

          Write-Host "=== Build directory (top levels) ==="
          if (Test-Path build) { Get-ChildItem -Path build -Depth 2 -Force -ErrorAction SilentlyContinue | Select-Object FullName,Length | Format-Table -AutoSize } else { Write-Host "build not found" }

          Write-Host "=== Dist directory contents ==="
          if (Test-Path dist) {
            Get-ChildItem -Path dist -File -Recurse -ErrorAction SilentlyContinue | Select-Object Name,FullName,Length | Format-Table -AutoSize
          } else {
            Write-Host "dist not found"
          }

          Write-Host "=== Locate vswhere and Visual Studio paths ==="
          $vswhereGuess = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          Write-Host "vswhere guess: $vswhereGuess"
          if (Test-Path $vswhereGuess) {
            Write-Host "vswhere found at guessed path"
            & $vswhereGuess -latest -products * -property installationPath 2>&1 | ForEach-Object { Write-Host "VS install: $_" }
          } else {
            Write-Host "vswhere not found at guessed location; trying PATH"
            Get-Command vswhere.exe -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "vswhere in PATH: $($_.Source)" }
          }

          Write-Host "=== Try to find dumpbin.exe candidates ==="
          $vsPaths = @()
          try { $vsPaths = (& $vswhereGuess -latest -products * -property installationPath) 2>$null } catch { }
          if (-not $vsPaths) {
            try { $vsPaths = (& vswhere -latest -products * -property installationPath) 2>$null } catch { }
          }
          $dumpbinCandidates = @()
          foreach ($p in $vsPaths) {
            $dumpbinCandidates += Get-ChildItem -Path (Join-Path $p "VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe") -ErrorAction SilentlyContinue
          }
          $dumpbinFromPath = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if ($dumpbinFromPath) { $dumpbinCandidates += Get-Item $dumpbinFromPath.Source }
          if ($dumpbinCandidates.Count -eq 0) {
            Write-Host "No dumpbin.exe candidates found. PATH dumpbin: $dumpbinFromPath"
          } else {
            Write-Host "dumpbin candidates:"
            $dumpbinCandidates | Select-Object FullName | Format-Table -AutoSize
            $chosen = $dumpbinCandidates | Sort-Object FullName -Descending | Select-Object -First 1
            Write-Host "Using dumpbin: $($chosen.FullName)"
            $executable = Join-Path `
              $Env:GITHUB_WORKSPACE `
              "build\\windows-${{ matrix.architecture }}-release\\installer-stage\\ClassMngr-windows-${{ matrix.architecture }}\\ClassMngr.exe"
            if (Test-Path -LiteralPath $executable) {
              & $chosen.FullName /headers $executable 2>&1 | Select-Object -First 60 | ForEach-Object { Write-Host $_ }
            } else {
              Write-Host "Executable not present at $executable — build step may have failed earlier"
            }
          }

      - name: Verify architecture and create checksum
        shell: pwsh
        run: |
          $architecture = "${{ matrix.architecture }}"
          $packageRoot = Join-Path `
            $Env:GITHUB_WORKSPACE `
            "build\\windows-$architecture-release\\installer-stage\\ClassMngr-windows-$architecture"
          $executable = Join-Path $packageRoot "ClassMngr.exe"
          $expectedMachine = if ($architecture -eq "arm64") { "ARM64" } else { "x64" }

          if (-not (Test-Path -LiteralPath $executable)) {
            Write-Host "ERROR: Expected executable was not found: $executable"
            Write-Host "Listing build directory to help debugging:"
            if (Test-Path build) { Get-ChildItem -Path build -Recurse -File | Select-Object FullName,Length | Format-Table -AutoSize }
            throw "Expected executable was not found: $executable"
          }

          $dumpbin = $null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vswhere) {
            $vsPath = (& $vswhere -latest -products * -property installationPath) 2>$null
            foreach ($p in $vsPath) {
              $candidate = Get-ChildItem -Path (Join-Path $p "VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe") -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
              if ($candidate) { $dumpbin = $candidate; break }
            }
          }
          if (-not $dumpbin) {
            $cmd = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
            if ($cmd) { $dumpbin = Get-Item $cmd.Source }
          }

          if ($null -eq $dumpbin) {
            Write-Host "ERROR: dumpbin.exe was not found. Searched vswhere guessed path and PATH."
            Write-Host "Please ensure Visual Studio Build Tools (dumpbin) are available on the runner."
            throw "dumpbin.exe was not found in the Visual Studio installation."
          }

          $headers = (& $dumpbin.FullName /headers $executable 2>&1) -join "`n"
          Write-Host "=== dumpbin /headers sample ==="
          $headers.Split("`n") | Select-Object -First 60 | ForEach-Object { Write-Host $_ }

          if ($headers -notmatch "machine \($expectedMachine\)") {
            throw "Executable did not have the expected $expectedMachine architecture."
          }

          $installers = Get-ChildItem -Path "dist" -Filter "*win-$architecture.exe" -File -ErrorAction SilentlyContinue
          Write-Host "Installers found: $($installers.Count)"
          if ($installers.Count -ne 1) {
            Write-Host "Detailed dist contents:"
            if (Test-Path dist) { Get-ChildItem -Path dist -Recurse -File | Select-Object FullName,Length | Format-Table -AutoSize }
            throw "Expected exactly one installer, found $($installers.Count)."
          }

          $hash = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "dist\\checksums-windows-$architecture.txt"
          "$hash  $($installers[0].Name)" | Set-Content -LiteralPath $checksumPath -Encoding utf8NoBOM

      - name: Verify staged Next package contents
        shell: pwsh
        run: |
          $architecture = "${{ matrix.architecture }}"
          $packageRoot = Join-Path `
            $Env:GITHUB_WORKSPACE `
            "build\windows-$architecture-release\installer-stage\ClassMngr-windows-$architecture"
          $cmakeText = Get-Content -LiteralPath "CMakeLists.txt" -Raw
          if ($cmakeText -notmatch 'project\(\s*ClassMngr\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)') {
            throw "Unable to read the ClassMngr project version from CMakeLists.txt."
          }
          $projectVersion = $Matches[1]
          $report = "build\windows-$architecture-release\reports\windows-$architecture-next-package.json"

          python scripts/verify_next_package.py verify `
            --package-root $packageRoot `
            --platform windows `
            --architecture $architecture `
            --version $projectVersion `
            --qt-version $env:QT_VERSION `
            --report $report
          if ($LASTEXITCODE -ne 0) { throw "Next package verification failed." }

          python scripts/test_verify_next_package.py
          if ($LASTEXITCODE -ne 0) { throw "Package verifier tests failed." }

      - name: Verify final Windows installer payload and installed Next app
        shell: pwsh
        run: |
          $architecture = "${{ matrix.architecture }}"
          $cmakeText = Get-Content -LiteralPath "CMakeLists.txt" -Raw
          if ($cmakeText -notmatch 'project\(\s*ClassMngr\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)') {
            throw "Unable to read the ClassMngr project version from CMakeLists.txt."
          }
          & "scripts\installer\verify_next_package.ps1" `
            -Architecture $architecture `
            -ProjectVersion $Matches[1] `
            -QtVersion $env:QT_VERSION `
            -InnoExtractPath $env:CLASSMNGR_INNOEXTRACT_PATH

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ClassMngr-windows-${{ matrix.architecture }}
          path: |
            dist/ClassMngr-*-win-${{ matrix.architecture }}.exe
            dist/checksums-windows-${{ matrix.architecture }}.txt
            build/windows-${{ matrix.architecture }}-release/reports/windows-${{ matrix.architecture }}-next-package.json
            build/windows-${{ matrix.architecture }}-release/reports/windows-${{ matrix.architecture }}-final-package.json
          if-no-files-found: error
