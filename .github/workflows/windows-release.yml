name: Windows Release Artifacts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-release.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "resources/**"
      - "scripts/build_release_windows.ps1"
      - "src/**"
      - "tests/**"

jobs:
  build:
    name: Windows MSVC x64 and ARM64
    runs-on: windows-2022
    env:
      QT_VERSION: "6.11.1"
      QT_ROOT: "C:\\Qt"
      QT_MSVC_X64_PREFIX: "C:\\Qt\\6.11.1\\win64_msvc2022_64"
      QT_MSVC_ARM64_PREFIX: "C:\\Qt\\6.11.1\\win64_msvc2022_arm64_cross_compiled"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade aqtinstall
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 --outputdir $env:QT_ROOT
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_arm64_cross_compiled --outputdir $env:QT_ROOT

      - name: Verify MSVC toolsets
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path -LiteralPath $vswhere)) {
              throw "vswhere.exe was not found."
          }

          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath

          if ([string]::IsNullOrWhiteSpace($vsPath)) {
              throw "No Visual Studio installation with MSVC tools was found."
          }

          $tools = Get-ChildItem -LiteralPath (Join-Path $vsPath "VC\Tools\MSVC") |
              Sort-Object Name -Descending |
              Select-Object -First 1

          if ($null -eq $tools) {
              throw "No MSVC toolset directory was found."
          }

          $requiredTools = @(
              "bin\Hostx64\x64\cl.exe",
              "bin\Hostx64\arm64\cl.exe"
          )

          foreach ($tool in $requiredTools) {
              $toolPath = Join-Path $tools.FullName $tool

              if (-not (Test-Path -LiteralPath $toolPath)) {
                  throw "Required MSVC tool was not found: $toolPath"
              }
          }

      - name: Build release artifacts
        shell: pwsh
        run: .\scripts\build_release_windows.ps1

      - name: Verify executable architectures
        shell: pwsh
        run: |
          function Find-Dumpbin {
              $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

              if (-not (Test-Path -LiteralPath $vswhere)) {
                  throw "vswhere.exe was not found."
              }

              $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath

              if ([string]::IsNullOrWhiteSpace($vsPath)) {
                  throw "No Visual Studio installation with MSVC tools was found."
              }

              $tools = Get-ChildItem -LiteralPath (Join-Path $vsPath "VC\Tools\MSVC") |
                  Sort-Object Name -Descending |
                  Select-Object -First 1

              if ($null -eq $tools) {
                  throw "No MSVC toolset directory was found."
              }

              return Join-Path $tools.FullName "bin\Hostx64\x64\dumpbin.exe"
          }

          function Assert-Machine {
              param(
                  [Parameter(Mandatory = $true)]
                  [string]$Exe,
                  [Parameter(Mandatory = $true)]
                  [string]$Pattern
              )

              if (-not (Test-Path -LiteralPath $Exe)) {
                  throw "Expected executable was not found: $Exe"
              }

              $headers = & $script:Dumpbin /headers $Exe 2>&1
              $text = $headers -join "`n"

              if ($text -notmatch $Pattern) {
                  throw "Executable '$Exe' did not match expected machine pattern '$Pattern'."
              }
          }

          $script:Dumpbin = Find-Dumpbin
          Assert-Machine -Exe "build\windows-msvc-x64-release\Release\ClassMngr.exe" -Pattern "machine \(x64\)"
          Assert-Machine -Exe "build\windows-msvc-arm64-release\Release\ClassMngr.exe" -Pattern "machine \(ARM64\)"

      - name: Upload x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassMngr-windows-x64
          path: build/windows-msvc-x64-release/Release/

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassMngr-windows-arm64
          path: build/windows-msvc-arm64-release/Release/
