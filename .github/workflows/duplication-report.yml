name: Duplication report

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/duplication-report.yml"
      - ".jscpd.json"
      - "src/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/duplication-report.yml"
      - ".jscpd.json"
      - "src/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: C++ token duplication
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"

      - name: Verify Node.js 26+
        shell: bash
        run: |
          node_major="$(node --version | cut -d. -f1 | tr -d v)"
          if [ "${node_major}" -lt 26 ]; then
            echo "Expected Node.js 26 or newer, found $(node --version)." >&2
            exit 1
          fi
          node --version
          npm --version

      - name: Generate report
        run: npx --yes jscpd@4.0.5 --config .jscpd.json src tests

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cpp-duplication-report
          path: artifacts/duplication
          if-no-files-found: warn
